<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="assets/css/imc-style.css">
</head>
<body>
    <section>
    <h2>Exercício - Calcular IMC</h2>

    <div class="form-group">
        <label for="nome-imc">Nome</label>
        <input type="text" id="nome-imc" placeholder="Digite o nome">
    </div>

    <div class="form-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" placeholder="Ex: 70.5" min="0">
    </div>

    <div class="form-group">
        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" placeholder="Ex: 1.75" min="0" step="0.01">
    </div>

    <button onclick="calcularImc()">Calcular IMC</button>

    <!-- Área de resultado, começa oculta -->
    <div class="resultado-imc oculto" id="resultado-imc">

        <!-- Caixa de classificação -->
        <div class="caixa-classificacao" id="caixa-classificacao">
            <p id="texto-resultado"></p>
        </div>

        <!-- Caixa de atenção, começa oculta -->
        <div class="caixa-atencao oculto" id="caixa-atencao">
             Atenção: seu IMC está fora da faixa considerada saudável. Consulte um médico.
        </div>

        <button onclick="esconderResultado()">Esconder Resultado</button>
    </div>
</section>

<!-- Adicione essa linha junto com os outros scripts -->
<script src="assets/js/exercicio-imc.js"></script>
</body>
</html>
