<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destaque de Produto</title>
    <link rel="stylesheet" href="assets/css/destaque-produto.css" />
</head>

<body>

    <!-- ===== ATIVIDADE 1 - Destaque de Produto ===== -->
    <h1>Página de Destaque de Produto</h1>

    <div id="produto" class="caixa-produto">
        <p id="nome-produto">Notebook Gamer</p>
    </div>

    <button onclick="definirCorVermelha()">Cor Vermelha</button>
    <button onclick="definirCorAzul()">Cor Azul</button>
    <button onclick="definirCorVerde()">Cor Verde</button>
    <button onclick="aumentarCaixa()">Aumentar Caixa</button>
    <button onclick="redefinirCaixa()">Redefinir</button>


    <!-- ===== ATIVIDADE 2 - Perfil de Usuário ===== -->
    <h1>Perfil de Usuário</h1>

    <div class="form-group">
        <label for="nome-cliente">Nome</label>
        <input type="text" id="nome-cliente" placeholder="Digite o nome">
    </div>

    <div class="form-group">
        <label for="tema">Tema</label>
        <select id="tema">
            <option selected disabled>Selecione um tema</option>
            <option value="fundo-escuro">Azul</option>
            <option value="fundo-claro">Azul claro</option>
            <option value="fundo-verde">Verde</option>
        </select>
    </div>

    <div class="form-group">
        <input type="checkbox" id="modoDestaque">
        <label for="modoDestaque">Ativar modo destaque</label>
    </div>

    <button onclick="aplicarPerfil()">Aplicar</button>

    <div class="card" id="card">
        <h2 id="card-nome">Nome </h2>
        <p id="card-descricao">Escolha um tema acima</p>
    </div>

    <script src="assets/js/destaque-produto01.js"></script>
<!-- ===== ATIVIDADE 3 - Cadastro com Tipo de Contato ===== -->
<h1>Cadastro de Contato</h1>

<!-- Nome -->
<div class="form-group">
    <label for="nome-contato">Nome</label>
    <input type="text" id="nome-contato" placeholder="Digite o nome">
</div>

<!-- Radio: tipo de contato -->
<div class="form-group">
    <span>Tipo de contato</span>
    <div class="radio-group">
        <input type="radio" id="tipo-pessoal" name="tipo-contato" value="pessoal" onclick="mostrarTipo()">
        <label for="tipo-pessoal">Pessoal</label>

        <input type="radio" id="tipo-comercial" name="tipo-contato" value="comercial" onclick="mostrarTipo()">
        <label for="tipo-comercial">Comercial</label>
    </div>
</div>

<!-- Área: contato pessoal -->
<div class="area-contato area-pessoal escondido" id="area-pessoal">
    <h3>Dados Pessoais</h3>

    <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="(00) 00000-0000">
    </div>

    <div class="form-group">
        <label for="data-nascimento">Data de Nascimento</label>
        <input type="date" id="data-nascimento">
    </div>
</div>

<!-- Área: contato comercial -->
<div class="area-contato area-comercial escondido" id="area-comercial">
    <h3>Dados Comerciais</h3>

    <div class="form-group">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" placeholder="Nome da empresa">
    </div>

    <div class="form-group">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
    </div>

    <div class="form-group">
        <label for="telefone-comercial">Telefone Comercial</label>
        <input type="text" id="telefone-comercial" placeholder="(00) 0000-0000">
    </div>
</div>

<!-- Botão -->
<button onclick="validarCadastro()">Validar Cadastro</button>

<!-- Resumo -->
<div class="resumo escondido" id="resumo">
    <h3>Resumo do Cadastro</h3>
    <textarea id="texto-resumo" readonly></textarea>
</div>


</body>

</html>
